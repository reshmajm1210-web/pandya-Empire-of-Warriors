<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pandya Empire - Character Selection</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      width:100vw;
      height:100vh;
      background:url("warbg.jpeg") center center/cover no-repeat;
      font-family:Arial, Helvetica, sans-serif;
    }

    canvas{
      display:block;
      position:absolute;
      top:0;
      left:0;
    }

    h1{
      position:absolute;
      top:20px;
      width:100%;
      text-align:center;
      color:white;
      font-size:42px;
      text-shadow:0 0 15px black;
      z-index:10;
    }

    .info{
      position:absolute;
      bottom:25px;
      width:100%;
      text-align:center;
      color:white;
      font-size:22px;
      text-shadow:0 0 10px black;
      z-index:10;
    }
  </style>
</head>

<body>

<h1>PANDYA EMPIRE OF WARRIORS</h1>

<div class="info">
  Left - Hero 👑 &nbsp;&nbsp;&nbsp; Right - Villain ⚔️
</div>

</html>
