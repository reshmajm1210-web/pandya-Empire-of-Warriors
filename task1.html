<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palace 3D Viewer</title>

    <script type="importmap">
    {
        "imports": {
            "three": "./node_modules/three/build/three.module.js",
            "three/addons/": "./node_modules/three/examples/jsm/"
        }
    }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #111;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-family: Arial, sans-serif;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="loading">Loading Palace...</div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";


/* ================= SCENE ================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x222222);


/* ================= CAMERA ================= */

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 5, 15);


/* ================= RENDERER ================= */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    window.devicePixelRatio
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);


/* ================= LIGHTS ================= */

const ambientLight = new THREE.AmbientLight(
    0xffffff,
    2
);

scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

directionalLight.position.set(
    10,
    20,
    10
);

directionalLight.castShadow = true;

scene.add(directionalLight);


/* ================= GROUND ================= */

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshStandardMaterial({
        color: 0x444444
    })
);

ground.rotation.x = -Math.PI / 2;

ground.position.y = -2;

ground.receiveShadow = true;

scene.add(ground);


/* ================= LOAD PALACE ================= */

const loader = new GLTFLoader();

loader.load(

    "./assets/models/palace.glb",

    function(gltf) {

        const palace = gltf.scene;

        palace.scale.set(
            2,
            2,
            2
        );

        palace.position.set(
            0,
            0,
            0
        );

        palace.traverse(function(object) {

            if (object.isMesh) {

                object.castShadow = true;
                object.receiveShadow = true;

            }

        });

        scene.add(palace);

        document.getElementById("loading").innerText =
            "🏰 Palace Loaded Successfully";

        console.log("Palace loaded:", palace);

    },

    function(progress) {

        if (progress.total > 0) {

            const percent =
                (progress.loaded / progress.total) * 100;

            document.getElementById("loading").innerText =
                "Loading Palace... " +
                Math.round(percent) +
                "%";

        }

    },

    function(error) {

        console.error(
            "PALACE LOAD ERROR:",
            error
        );

        document.getElementById("loading").innerText =
            "❌ palace.glb loading failed";

    }

);


/* ================= ORBIT CONTROLS ================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.enableZoom = true;

controls.enableRotate = true;

controls.enablePan = false;

controls.target.set(
    0,
    2,
    0
);

controls.update();


/* ================= RESIZE ================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* ================= ANIMATION ================= */

function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>
